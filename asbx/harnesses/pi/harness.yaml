# How asbx renders shared/workflow.md for this harness.
instructions:
  file: AGENTS.md
  target: /home/agent/.pi/agent/AGENTS.md # symlinked to the rendered file

# Where the rendered shared/skills are linked.
skills:
  target: /home/agent/.agents/skills

# pi extensions (*.ts, or dirs with index.ts) from harnesses/pi/extensions.
# Rendered as templates like hooks ({{.Shared}} = shared/), so avoid a literal "{{".
hooks:
  dir: extensions
  target: /home/agent/.pi/agent/extensions

# Top-level asbx/ dirs mounted read-write (the agents write to them).
writable:
  - learnings

# More dirs, rendered and linked like hooks ({{.Shared}} = shared/).
dirs:
  # Subagent definitions for extensions/subagent.
  - dir: agents
    target: /home/agent/.pi/agent/agents
  # Prompt templates (/lead, /feedback).
  - dir: prompts
    target: /home/agent/.pi/agent/prompts

# Extra config files from harnesses/pi/files, each symlinked to its target.
files:
  # pi defaults to api.individual.githubcopilot.com; the sbx proxy injects
  # Copilot auth on api.githubcopilot.com.
  - file: models.json
    target: /home/agent/.pi/agent/models.json
  # Copied once at create: pi writes to its own settings.json.
  - file: settings.json
    target: /home/agent/.pi/agent/settings.json
    copy: true
  # ctrl+j/ctrl+k navigate selection lists (model picker, /tree, etc.).
  - file: keybindings.json
    target: /home/agent/.pi/agent/keybindings.json
