# Repos used by asbx (one sandbox each, copilot-<name>, mounted read-only into
# the others) and by the wezterm project picker.
#
#   url:  git url, cloned to path if it doesn't exist yet
#   path: where the repo lives (default: <root>/<name>)

root: ~/Code/nova

repos:
  b2b:
    url: git@github.com:belgianmobileid/nova-alm-b2b.git
  sync:
    url: git@github.com:belgianmobileid/nova-alm-sync.git
  ddc:
    url: git@github.com:belgianmobileid/nova-alm-documentdatacapture.git
  toolbox:
    url: git@github.com:belgianmobileid/nova-toolbox.git
