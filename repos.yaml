# Repos used by asbx (one sandbox each, copilot-<name>, mounted read-only into
# the others) and by the wezterm project picker.
#
#   url:  git url, cloned to path if it doesn't exist yet
#   path: where the repo lives (default: <root>/<name>)
#   enabledOn / disabledOn: list of machine names (from the gitignored
#           .machine file in the dotty root) to limit asbx to; use one, not
#           both. Neither set = every machine.
#   layout: wezterm workspace layout, dev (default) or worktree
#           (worktree expects <path>/main and <path>/clanker)

root: ~/Code/nova

repos:
  tf-alm:
    url: git@github.com:belgianmobileid/infra-tf-account-lifecycle-manager.git
    path: ~/Code/tf/tf-alm
  rbac:
    url: git@github.com:belgianmobileid/nova-alm-rbac.git
  b2b:
    url: git@github.com:belgianmobileid/nova-alm-b2b.git
  sync:
    url: git@github.com:belgianmobileid/nova-alm-sync.git
  ddc:
    url: git@github.com:belgianmobileid/nova-alm-documentdatacapture.git
  mdc:
    url: git@github.com:belgianmobileid/nova-alm-manualdatacapture.git
  toolbox:
    url: git@github.com:belgianmobileid/nova-toolbox.git
  dotty:
    url: git@privategithub:arnegoeteyn/dotty.git
    layout: local_agent
    path: ~/Documents/dotty
